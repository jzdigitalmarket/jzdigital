<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JZ Editor Profissional</title>
<style>
:root{--paper:rgba(255,255,255,.85);--surface:rgba(255,255,255,.85);--hover:#fff;--line:rgba(0,0,0,.15);--tick:rgba(0,0,0,.3)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px clamp(10px,13vw,5cm);display:flex;flex-direction:column;height:100dvh;transition:background-color .3s,color .3s}

.toolbar{display:flex;flex-direction:column;gap:8px;margin:0 calc(12px - clamp(10px,13vw,5cm)) 12px}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#fontSelector{width:122px}
#fontSizeSelector{width:82px}
.theme-box{display:flex;align-items:center;gap:6px;margin-right:8px}
.logo{display:flex;align-items:center;gap:8px;margin-right:12px;user-select:none}
.logo small{display:block;font-size:12px;font-weight:600;line-height:1;color:#2b579a;letter-spacing:.2px}
.logo b{display:block;font-size:19px;line-height:1.05;color:#2b579a;letter-spacing:-.3px}
.theme-night .logo small,.theme-night .logo b{color:#9db9f0}
#mascote{position:fixed;right:calc(clamp(10px,13vw,5cm) + 26px);bottom:46px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
#mascote>*{pointer-events:auto}
#clipe{height:96px;cursor:pointer;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));animation:pula .6s ease-out 1}
#balao{position:relative;max-width:190px;margin:0 0 12px;padding:9px 26px 9px 12px;background:#fffbd6;color:#222;border:1px solid #444;border-radius:10px;font-size:13.5px;line-height:1.35;box-shadow:0 3px 8px rgba(0,0,0,.18)}
#balao[hidden]{display:none}
#balao::before,#balao::after{content:'';position:absolute;right:34px;border:solid transparent;border-bottom:0}
#balao::before{bottom:-10px;border-width:10px 9px 0;border-top-color:#444}
#balao::after{bottom:-8px;border-width:9px 8px 0;border-top-color:#fffbd6}
#balao button{position:absolute;top:2px;right:2px;height:22px;min-width:22px;padding:0;border:0;background:none;color:#555;font-size:16px;line-height:1}
@keyframes pula{0%{transform:translateY(14px);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){#clipe{animation:none}}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select,button{height:36px;min-width:34px;padding:6px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer;font:inherit;font-size:14px;font-weight:500}
button:hover,select:hover{background:var(--hover);color:#222}
option{color:#222;background:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #5b6ee1;outline-offset:2px}
.danger{border-color:#d9534f;color:#a94442}

.split{display:flex;position:relative}
.split-main{display:flex;align-items:center;gap:6px;border-radius:6px 0 0 6px}
.split-arrow{min-width:24px;padding:6px;font-size:10px;border-radius:0 6px 6px 0;border-left:0}
#colorIndicator{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}
#palette{position:absolute;top:40px;left:0;z-index:20;display:grid;grid-template-columns:repeat(8,22px);gap:4px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#palette[hidden]{display:none}
#palette button{width:22px;height:22px;min-width:0;padding:0;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
#palette .custom{grid-column:1/-1;width:auto;height:28px;font-size:13px;background:#f3f3f3;color:#222}

.panel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.panel[hidden]{display:none}
.panel input[type=text]{flex:1;min-width:140px;height:36px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#fff;color:#222}
#aiText{flex:1 1 100%;max-height:30vh;overflow:auto;white-space:pre-wrap;line-height:1.5}

.editor-layout{flex:1;min-height:0;display:grid;grid-template-columns:24px 1fr;grid-template-rows:22px 1fr;background:rgba(255,255,255,.4);border-radius:12px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.05);overflow:hidden}
.ruler-corner{background:rgba(0,0,0,.05);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ruler{position:relative;overflow:hidden;background:rgba(0,0,0,.03);font-size:9px;opacity:.85}
.ruler-h{grid-column:2;grid-row:1;border-bottom:1px solid var(--line)}
.ruler-v{grid-column:1;grid-row:2;border-right:1px solid var(--line)}
.ruler .scale{position:absolute}
.ruler span{position:absolute}
.ruler-h span{top:1px}
.ruler-v span{left:3px}
/* 1 cm = 37.795px; as réguas começam onde o texto começa */
.ruler-h .scale{top:0;bottom:0;background:
 repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 37.795px) left bottom/100% 10px no-repeat,
 repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 18.898px) left bottom/100% 5px no-repeat}
.ruler-v .scale{left:0;right:0;background:
 repeating-linear-gradient(180deg,var(--tick) 0 1px,transparent 1px 37.795px) right top/10px 100% no-repeat,
 repeating-linear-gradient(180deg,var(--tick) 0 1px,transparent 1px 18.898px) right top/5px 100% no-repeat}

#editor{tab-size:1.25cm;grid-column:2;grid-row:2;position:relative;--pl:max(24px,calc((100% - 21cm)/2 + 3cm));--pr:max(24px,calc((100% - 21cm)/2 + 2cm));padding:3cm var(--pr) 2cm var(--pl);background:linear-gradient(to right,transparent calc((100% - 21cm)/2),var(--paper) calc((100% - 21cm)/2),var(--paper) calc((100% + 21cm)/2),transparent calc((100% + 21cm)/2)) local;outline:none;overflow-y:auto;line-height:1.5;font-size:12pt;font-family:Arial,Helvetica,sans-serif;word-wrap:break-word}
#editor.vazio::before{content:attr(data-placeholder);position:absolute;top:3cm;left:calc(var(--pl) + 1.25cm);opacity:.5;pointer-events:none}
/* Parágrafo do corpo do texto (ABNT): justificado, recuo de 1,25 cm na 1ª linha, espaçamento 1,5 */
#editor p{margin:0;text-align:justify;text-indent:1.25cm;line-height:1.5}
#editor h1,#editor h2{margin:.6em 0 .3em;text-align:left;text-indent:0;line-height:1.5}
#editor li{text-indent:0;text-align:left}
/* Numeração automática dos títulos (1, 1.1, 1.1.1), ligada pelo botão "Numerar títulos" */
#editor.num{counter-reset:h1 h2 h3}
#editor.num h1{counter-increment:h1;counter-reset:h2 h3}
#editor.num h2{counter-increment:h2;counter-reset:h3}
#editor.num h3{counter-increment:h3}
#editor.num h1::before{content:counter(h1) " "}
#editor.num h2::before{content:counter(h1) "." counter(h2) " "}
#editor.num h3::before{content:counter(h1) "." counter(h2) "." counter(h3) " "}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);z-index:50;max-width:min(92vw,560px);padding:11px 16px;border-radius:8px;font-size:14px;line-height:1.4;color:#fff;background:#b3261e;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:transform .25s ease}
#toast.show{transform:translate(-50%,0)}
#toast.aviso{background:#8a5a00}
#toast.ok{background:#1e7d46}
#aiPanel.carregando .ia-res{display:none}
#aiPanel.carregando #aiText::before{content:'';display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid var(--line);border-top-color:#5b6ee1;border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}#aiPanel.carregando #aiText::before{animation-duration:2s}}
button[aria-pressed="true"]{background:var(--hover);color:#222;border-color:#5b6ee1;box-shadow:inset 0 0 0 1px #5b6ee1}
/* Folha A4 (ABNT): texto de 16 cm, margens 3/2/2/3 cm. Linhas tracejadas marcam a troca de página */
#guiaPaginas{grid-column:2;grid-row:2;position:relative;overflow:hidden;pointer-events:none}
#guiaPaginas .g{position:absolute;left:0;right:0;top:0}
#guiaPaginas i{position:absolute;left:max(0px,calc((100% - 21cm)/2));right:max(0px,calc((100% - 21cm)/2));height:0;border-top:1px dashed var(--tick)}
#guiaPaginas i span{position:absolute;right:8px;top:3px;font:11px sans-serif;font-style:normal;opacity:.75}
#editor img{max-width:100%;border-radius:8px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
/* Citação longa (ABNT): recuo de 4 cm, fonte 10 pt, espaçamento simples */
#editor blockquote{margin:12px 0 12px 4cm;padding:0;border:0;font-size:10pt;line-height:1.15;text-align:justify;text-indent:0}
#editor blockquote p,#editor li p{text-indent:0;line-height:inherit}
#editor a{color:#3b5bdb}

.status-bar{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;opacity:.75}


.theme-cream{background-color:#FAF9F6;color:#2F2E2D}
.theme-lavender{background-color:#E8E8F8;color:#2C2C3E}
.theme-peach{background-color:#FFE5D9;color:#3E2C2A}
.theme-mint{background-color:#E2F0D9;color:#253325}
.theme-rose{background-color:#FFE3E3;color:#3E2B2B}
.theme-sky{background-color:#E4F1FE;color:#223344}
.theme-lemon{background-color:#FFF3CD;color:#3A3520}
.theme-lilac{background-color:#F3E5F5;color:#332638}
.theme-aqua{background-color:#E0F2F1;color:#1F3332}
.theme-sand{background-color:#F4EAE1;color:#38302A}
.theme-night{--paper:rgba(255,255,255,.07);background-color:#1d1f27;color:#e6e6ec;--surface:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--tick:rgba(255,255,255,.4)}
.theme-night #editor a{color:#8fa8ff}

@media (max-width:700px){
  .editor-layout{grid-template-columns:1fr;grid-template-rows:1fr}
  .ruler,.ruler-corner{display:none}
  #clipe{height:64px}
  #balao{max-width:150px;font-size:12.5px}
  #editor{grid-column:1;grid-row:1;--pl:24px;--pr:24px;padding:24px;background:var(--paper)}
  #guiaPaginas{display:none}
}
@page{size:A4;margin:3cm 2cm 2cm 3cm;@top-right{content:counter(page);font:12pt Arial,sans-serif;text-align:right;vertical-align:top;padding-top:2cm}}
@media print{
  .toolbar,.panel,.status-bar,.ruler,.ruler-corner,#mascote{display:none!important}
  body{padding:0;height:auto;background:#fff!important;color:#000!important}
  .editor-layout{display:block;border:0;box-shadow:none;background:none;overflow:visible}
  #editor{overflow:visible;padding:0;background:none}
  #guiaPaginas{display:none!important}
}
</style>
</head>
<body class="theme-cream">

<div class="toolbar" id="toolbar">
  <div class="row">
    <div class="logo" title="Maycrousofiti Uordi">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#2b579a"/><rect x="3" y="3" width="28" height="28" rx="5" fill="none" stroke="#5b87d6" stroke-width="1.2"/><path d="M10 8v11a7 7 0 0 0 14 0V8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>
      <span><small>Maycrousofiti</small><b>Uordi</b></span>
    </div>
    <div class="theme-box">
    <span style="font-size:13px;font-weight:600;opacity:.85">Ambiente:</span>
    <select id="themeSelector" onchange="mudarTema(this.value)" aria-label="Tema de cores">
      <option value="theme-cream">Creme</option>
      <option value="theme-lavender">Lavanda</option>
      <option value="theme-peach">Pêssego</option>
      <option value="theme-mint">Menta</option>
      <option value="theme-rose">Rosa Suave</option>
      <option value="theme-sky">Azul Céu</option>
      <option value="theme-lemon">Limão</option>
      <option value="theme-lilac">Lilás</option>
      <option value="theme-aqua">Água Marinha</option>
      <option value="theme-sand">Areia</option>
      <option value="theme-night">Noite</option>
    </select>
    </div>
    <input type="file" id="fileInput" style="display:none" accept=".html,.htm,.md,.txt" onchange="abrirArquivo(event)">
    <input type="file" id="imgInput" style="display:none" accept="image/*" multiple onchange="[...this.files].forEach(inserirImagem);this.value=''">
    <button onclick="$('fileInput').click()">📂 Abrir</button>
    <button onclick="salvarComo()" title="Salvar como (Ctrl+S)">💾 Salvar</button>
    <button onclick="window.print()" title="Imprimir ou salvar em PDF">🖨️</button>
    <select id="aiSelector" onchange="chamarIA(this.value)" aria-label="Assistente de IA">
      <option value="">✨ IA</option>
      <option value="corrigir">Corrigir texto</option>
      <option value="melhorar">Melhorar redação</option>
      <option value="formal">Tom formal</option>
      <option value="simplificar">Simplificar</option>
      <option value="resumir">Resumir</option>
      <option value="traduzir">Traduzir para inglês</option>
    </select>
    <select id="estiloSel" onchange="aplicarEstilo(this.value);this.value=''" aria-label="Estilo do parágrafo">
      <option value="">Estilo</option><option value="corpo">Parágrafo (ABNT)</option><option value="h1">Título 1</option>
      <option value="h2">Título 2</option><option value="blockquote">Citação longa</option><option value="ref">Referência</option>
    </select>
    <button onclick="inserirSumario()" title="Gera ou atualiza o sumário a partir dos títulos H1 e H2 (páginas aproximadas)">📑 Sumário</button>
    <button id="btnNum" aria-pressed="false" onclick="alternarNumeracao()" title="Numera automaticamente os títulos H1, H2 e H3 (1, 1.1, 1.1.1)">🔢 Numerar títulos</button>
    <button id="btnDesfazer" hidden onclick="desfazerSnapshot()" title="Desfaz a última limpeza ou ajuste de formato (Ctrl+Z)">↩ Desfazer</button>
  </div>

  <div class="row">
    <select id="fontSelector" onchange="mudarFonte(this.value)" aria-label="Fonte do texto selecionado">
      <option>Arial</option><option>Times New Roman</option><option>Verdana</option>
      <option>Trebuchet MS</option><option>Georgia</option><option>Courier New</option>
    </select>
    <select id="fontSizeSelector" onchange="mudarTamanho(this.value)" aria-label="Tamanho do texto (pt)">
      <option value="">Tamanho</option>
      <option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>14</option>
      <option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option>
    </select>
    <div class="split">
      <button type="button" class="split-main" onclick="mudarCor(corAtual)" title="Aplicar a cor ao texto selecionado">
        <span id="colorIndicator" style="background:#c0392b"></span>Cor
      </button>
      <button type="button" class="split-arrow" id="colorArrow" onclick="togglePaleta()" title="Escolher outra cor" aria-haspopup="true" aria-expanded="false">▼</button>
      <div id="palette" hidden></div>
    </div>
    <input type="color" id="fontColorPicker" onchange="mudarCor(this.value)" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0" tabindex="-1">
    <button onclick="formatar('undo')" title="Desfazer (Ctrl+Z)">↶</button>
    <button onclick="formatar('redo')" title="Refazer (Ctrl+Y)">↷</button>
    <button onclick="formatar('bold')" title="Negrito (Ctrl+B)"><b>B</b></button>
    <button onclick="formatar('italic')" title="Itálico (Ctrl+I)"><i>I</i></button>
    <button onclick="formatar('underline')" title="Sublinhado (Ctrl+U)"><u>U</u></button>
    <button onclick="formatar('strikeThrough')" title="Tachado"><s>S</s></button>
    <button onclick="bloco('h1')" title="Título 1">H1</button>
    <button onclick="bloco('h2')" title="Título 2">H2</button>
    <button onclick="bloco('blockquote')" title="Citação">❝</button>
    <button onclick="formatar('insertUnorderedList')" title="Lista com marcadores">• Lista</button>
    <button onclick="formatar('insertOrderedList')" title="Numeração">Numeração</button>
    <select onchange="formatar(this.value);this.value=''" aria-label="Alinhamento">
      <option value="">Alinhar</option>
      <option value="justifyLeft">Esquerda</option>
      <option value="justifyCenter">Centralizar</option>
      <option value="justifyRight">Direita</option>
      <option value="justifyFull">Justificar</option>
    </select>
    <button onclick="inserirLink()" title="Inserir link">🔗</button>
    <button onclick="$('imgInput').click()" title="Inserir imagem">🖼️</button>
    <button onclick="limparFormatacao()" title="Remove marcas, numeração e alinhamento: deixa só o texto em Arial 14, preto, à esquerda. Sem seleção, limpa o texto todo.">Limpar formatos</button>
    <button onclick="aplicarABNT()" title="Parágrafo ABNT: justificado, recuo de 1,25 cm, espaçamento 1,5 (na seleção, ou no texto todo se nada estiver selecionado)">ABNT</button>
    <button onclick="toggleFindReplace()" title="Localizar e substituir (Ctrl+F)">🔍 Localizar</button>
    <button class="danger" onclick="limparEditor()" title="Apagar todo o texto">🗑️ Apagar</button>
  </div>
</div>

<div class="panel" id="findReplacePanel" hidden>
  <input type="text" id="findText" placeholder="Localizar..." aria-label="Localizar"
         oninput="idxBusca=-1;localizar(1)"
         onkeydown="if(event.key==='Enter'){event.preventDefault();localizar(event.shiftKey?-1:1)}">
  <input type="text" id="replaceText" placeholder="Substituir por..." aria-label="Substituir por">
  <label title="Diferenciar maiúsculas de minúsculas" style="font-size:13px"><input type="checkbox" id="caseSens" onchange="idxBusca=-1;localizar(1)"> Aa</label>
  <button onclick="localizar(-1)" title="Anterior (Shift+Enter)">↑</button>
  <button onclick="localizar(1)" title="Próximo (Enter)">↓</button>
  <button onclick="substituirUnico()">Substituir</button>
  <button onclick="substituirTudo()">Substituir todos</button>
  <span id="findInfo" style="font-size:13px;min-width:70px"></span>
  <button onclick="toggleFindReplace()" aria-label="Fechar">✕</button>
</div>

<div id="toast" role="alert" aria-live="assertive"></div>

<div class="panel" id="aiPanel" hidden>
  <div id="aiText"></div>
  <button class="ia-res" onclick="aplicarIA('trocar')">Aplicar no lugar</button>
  <button class="ia-res" onclick="aplicarIA('abaixo')">Inserir abaixo</button>
  <button id="btnIaFechar" onclick="fecharIA()">Descartar</button>
</div>

<div class="editor-layout">
  <div class="ruler-corner"></div>
  <div class="ruler ruler-h" id="horizontalRuler"></div>
  <div class="ruler ruler-v" id="verticalRuler"></div>
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Comece a digitar, cole imagens ou arraste arquivos aqui..."></div>
  <div id="guiaPaginas"></div>
</div>

<div class="status-bar">
  <span id="wordCount">0 palavras</span>
  <span id="saveStatus" aria-live="polite">Pronto</span>
</div>

<script>
const $ = id => document.getElementById(id);
const editor = $('editor');
const LIMITE_IA = 20000; // limite de caracteres aceito pela função /api/gemini
const KEY = { c: 'jz_editor_content', t: 'jz_editor_theme', f: 'jz_editor_font', n: 'jz_editor_numtitulos' };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const ler = k => { try { return localStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

function status(msg, erro) {
  const s = $('saveStatus');
  s.textContent = msg;
  s.style.color = erro ? '#c0392b' : '';
}

/* ---------- Seleção: mantém o texto selecionado ao usar menus e botões ---------- */
let savedRange = null;
document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if (s.rangeCount && editor.contains(s.anchorNode)) { savedRange = s.getRangeAt(0).cloneRange(); atualizarCaixas(); }
  renderStats();
});
function restaurarSelecao() {
  editor.focus();
  if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
}
// Botões não roubam o foco do editor
$('toolbar').addEventListener('mousedown', e => { if (!e.target.closest('select,input')) e.preventDefault(); });

/* ---------- Sanitização (conteúdo colado, aberto ou salvo) ---------- */
const TAGS = new Set('P,BR,DIV,SPAN,B,STRONG,I,EM,U,S,STRIKE,H1,H2,H3,UL,OL,LI,A,IMG,BLOCKQUOTE,HR,PRE,CODE,SUB,SUP,TABLE,THEAD,TBODY,TR,TD,TH'.split(','));
const CSS_OK = ['color', 'font-size', 'font-weight', 'font-style', 'text-decoration', 'text-align', 'white-space', 'font-family', 'text-indent', 'line-height', 'margin-left', 'margin-bottom'];
// colagem = true: descarta fontes, cores e tamanhos de Word/sites, mas mantém negrito, itálico e sublinhado
function limpar(root, colagem) {
  root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,select,textarea,svg,video,audio').forEach(n => n.remove());
  root.querySelectorAll('*').forEach(el => {
    if (!el.parentNode) return;
    if (!TAGS.has(el.tagName)) { el.replaceWith(...el.childNodes); return; }
    for (const a of [...el.attributes]) {
      const n = a.name;
      if (n === 'style' && colagem) {
        const st = el.style, tags = [];
        if (st.fontWeight === 'bold' || +st.fontWeight >= 600) tags.push('b');
        if (st.fontStyle === 'italic') tags.push('i');
        if (/underline/.test(st.textDecoration)) tags.push('u');
        el.removeAttribute('style');
        tags.forEach(t => { const w = document.createElement(t); while (el.firstChild) w.appendChild(el.firstChild); el.appendChild(w); });
      } else if (n === 'style') {
        const keep = CSS_OK.map(p => [p, el.style.getPropertyValue(p)]).filter(x => x[1]);
        el.removeAttribute('style');
        keep.forEach(([p, v]) => el.style.setProperty(p, v));
      } else if (n === 'href' && /^(https?:|mailto:)/i.test(a.value)) {
      } else if (n === 'src' && /^(data:image\/(png|jpe?g|gif|webp);|https:)/i.test(a.value)) {
      } else el.removeAttribute(n);
    }
    if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
  });
  return root;
}
// Texto solto no topo (sem <p>) vira parágrafo, para valer o padrão ABNT
function empacotar(root) {
  let p = null;
  [...root.childNodes].forEach(n => {
    if (n.nodeType === 1 && /^(P|DIV|H[1-6]|UL|OL|BLOCKQUOTE|PRE|TABLE|HR)$/.test(n.nodeName)) { p = null; return; }
    if (n.nodeType === 3 && !n.nodeValue.trim() && !p) { n.remove(); return; }
    if (!p) { p = document.createElement('p'); root.insertBefore(p, n); }
    p.appendChild(n);
    if (n.nodeName === 'BR') p = null;
  });
}
function htmlSeguro(str, paragrafos, colagem) {
  const body = limpar(new DOMParser().parseFromString(str, 'text/html').body, colagem);
  if (paragrafos) empacotar(body);
  return body.innerHTML;
}

/* ---------- Inicialização ---------- */
window.addEventListener('DOMContentLoaded', () => {
  const tema = ler(KEY.t) || 'theme-cream', c = ler(KEY.c);
  $('themeSelector').value = tema;
  document.body.className = tema;
  montarPaleta();
  alternarNumeracao(ler(KEY.n) === '1');
  if (c) editor.innerHTML = htmlSeguro(c, true);
  document.execCommand('defaultParagraphSeparator', false, 'p');
  garantirParagrafo();
  marcarVazio();
  atualizarEstatisticas();
  atualizarReguas();
  new ResizeObserver(atualizarReguas).observe(editor);
  editor.focus();
});

/* ---------- Réguas em centímetros, sincronizadas com o texto ---------- */
const CM = 96 / 2.54;
let reguaV = 0;
function atualizarReguas() {
  const cs = getComputedStyle(editor);
  const pl = parseFloat(cs.paddingLeft), pt = parseFloat(cs.paddingTop);
  const w = editor.clientWidth - pl - parseFloat(cs.paddingRight);
  if (w <= 0) return;
  let h = `<div class="scale" style="left:${pl}px;width:${w}px">`;
  for (let i = 1; i * CM < w; i++) h += `<span style="left:${i * CM - 3}px">${i}</span>`;
  $('horizontalRuler').innerHTML = h + '</div>';

  const n = Math.ceil(Math.max(editor.scrollHeight, editor.clientHeight) / CM / 10) * 10;
  if (n !== reguaV) {
    reguaV = n;
    let v = `<div class="scale" style="top:${pt}px;height:${n * CM}px">`;
    for (let i = 1; i < n; i++) v += `<span style="top:${i * CM - 5}px">${i}</span>`;
    $('verticalRuler').innerHTML = v + '</div>';
  }
  desenharPaginas();
}
function sincronizarRegua() {
  ['verticalRuler', 'guiaPaginas'].forEach(id => {
    const s = $(id).firstChild;
    if (s) s.style.transform = `translateY(${-editor.scrollTop}px)`;
  });
}
// Altura útil de uma página A4 com margens ABNT: 29,7 - 3 - 2 = 24,7 cm (marcação aproximada)
const PAGE_H = 24.7 * CM;
function alturaConteudo() {
  const u = editor.lastElementChild, pt = parseFloat(getComputedStyle(editor).paddingTop);
  return u ? u.offsetTop + u.offsetHeight - pt : 0;
}
function paginaDe(el) {
  return Math.floor((el.offsetTop - parseFloat(getComputedStyle(editor).paddingTop)) / PAGE_H) + 1;
}
function desenharPaginas() {
  const alvo = $('guiaPaginas');
  if (!alvo.offsetParent) return; // oculto em telas pequenas
  const pt = parseFloat(getComputedStyle(editor).paddingTop);
  const n = Math.max(0, Math.ceil(alturaConteudo() / PAGE_H) - 1);
  if (alvo.dataset.n !== n + '/' + pt) {
    alvo.dataset.n = n + '/' + pt;
    let h = '<div class="g">';
    for (let i = 1; i <= n; i++) h += `<i style="top:${pt + i * PAGE_H}px"><span>Página ${i + 1}</span></i>`;
    alvo.innerHTML = h + '</div>';
  }
  sincronizarRegua();
}
editor.addEventListener('scroll', sincronizarRegua);

/* ---------- Tema, fonte, tamanho e cor ---------- */
function mudarTema(t) {
  document.body.className = document.body.className.replace(/theme-\S+/, t);
  guardar(KEY.t, t);
}
const FAMILIAS = {
  'Arial': 'Arial, Helvetica, sans-serif',
  'Times New Roman': '"Times New Roman", Times, serif',
  'Verdana': 'Verdana, Geneva, sans-serif',
  'Trebuchet MS': '"Trebuchet MS", Helvetica, sans-serif',
  'Georgia': 'Georgia, serif',
  'Courier New': '"Courier New", Courier, monospace'
};
function temSelecao() {
  const s = getSelection();
  return s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode) && editor.contains(s.focusNode);
}
// A fonte vale só para o texto selecionado. Sem seleção, a caixa volta ao valor anterior.
function mudarFonte(nome) {
  restaurarSelecao();
  if (!temSelecao()) { atualizarCaixas(); status('Selecione um texto para aplicar a fonte.', true); return; }
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('fontName', false, FAMILIAS[nome] || nome);
  agendarSalvar();
  atualizarCaixas();
}
let tamPendente = null;
function mudarTamanho(pt) {
  if (!pt) return;
  restaurarSelecao();
  document.execCommand('styleWithCSS', false, true);
  tamPendente = pt;
  document.execCommand('fontSize', false, '7'); // marca o trecho; vira o tamanho em pt
  converterTamanhos();
  agendarSalvar();
  atualizarCaixas();
}
function converterTamanhos() {
  editor.querySelectorAll('[style*="xxx-large"]').forEach(el => { el.style.fontSize = (tamPendente || 12) + 'pt'; });
}
// As caixas de fonte e tamanho mostram o que está no cursor/seleção
function atualizarCaixas() {
  const s = getSelection();
  if (!s.rangeCount || !editor.contains(s.anchorNode)) return;
  const el = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement;
  const cs = getComputedStyle(el);
  const nome = cs.fontFamily.split(',')[0].replace(/["']/g, '').trim();
  $('fontSelector').value = FAMILIAS[nome] ? nome : 'Arial';
  const pt = Math.round(parseFloat(cs.fontSize) * 0.75);
  $('fontSizeSelector').value = [...$('fontSizeSelector').options].some(o => o.value == pt) ? pt : '';
}
let corAtual = '#c0392b';
const CORES = ['#000000', '#434343', '#7f7f7f', '#bfbfbf', '#ffffff', '#c0392b', '#e67e22', '#f1c40f',
               '#27ae60', '#16a085', '#2980b9', '#2c3e50', '#8e44ad', '#d81b60', '#795548', '#00acc1'];
function montarPaleta() {
  $('palette').innerHTML = CORES.map(c => `<button type="button" style="background:${c}" title="${c}" onclick="mudarCor('${c}')"></button>`).join('')
    + '<button type="button" class="custom" onclick="$(\'fontColorPicker\').click()">Outra cor...</button>';
}
function togglePaleta(abrir) {
  const p = $('palette');
  const mostrar = abrir === undefined ? p.hidden : abrir;
  p.hidden = !mostrar;
  $('colorArrow').setAttribute('aria-expanded', mostrar);
}
document.addEventListener('click', e => { if (!e.target.closest('.split')) togglePaleta(false); });
function mudarCor(cor) {
  corAtual = cor;
  $('colorIndicator').style.backgroundColor = cor;
  togglePaleta(false);
  restaurarSelecao();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, cor);
  agendarSalvar();
}

/* ---------- Formatação ---------- */
function formatar(cmd, valor = null) {
  if (!cmd) return;
  restaurarSelecao();
  // alinhamento em CSS (sobrevive ao recarregar); negrito/itálico em tags (<b>, <i>)
  document.execCommand('styleWithCSS', false, /^justify/.test(cmd));
  document.execCommand(cmd, false, valor);
  agendarSalvar();
}
function bloco(tag) {
  restaurarSelecao();
  const atual = (document.queryCommandValue('formatBlock') || '').toLowerCase();
  document.execCommand('formatBlock', false, atual === tag ? 'p' : tag);
  agendarSalvar();
}
function inserirLink() {
  const url = prompt('Endereço do link (https://...):', 'https://');
  if (!url) return;
  if (!/^(https?:|mailto:)/i.test(url)) { status('O link precisa começar com https://, http:// ou mailto:', true); return; }
  formatar('createLink', url);
}
// Reduz um trecho a texto puro: sem negrito, cor, tamanho, títulos, listas, citações ou links.
// Imagens são mantidas. O texto fica em Arial 14 pt, preto, à esquerda.
const ESTILO_PADRAO = 'font-family:Arial,Helvetica,sans-serif;font-size:14pt;color:#000000;text-align:left;text-indent:0;line-height:1.5';
function fragParaPlano(frag) {
  const BLOCO = /^(P|DIV|H[1-6]|LI|UL|OL|BLOCKQUOTE|PRE|TABLE|TR)$/;
  const paras = [''];
  const novo = () => { if (paras[paras.length - 1] !== '') paras.push(''); };
  (function andar(n) {
    n.childNodes.forEach(c => {
      if (c.nodeType === 3) paras[paras.length - 1] += esc(c.nodeValue.replace(/\s+/g, ' '));
      else if (c.nodeType === 1) {
        if (c.tagName === 'IMG') paras[paras.length - 1] += `<img src="${(c.getAttribute('src') || '').replace(/"/g, '&quot;')}">`;
        else if (c.tagName === 'BR') paras[paras.length - 1] += '<br>';
        else if (BLOCO.test(c.tagName)) { novo(); andar(c); novo(); }
        else andar(c);
      }
    });
  })(frag);
  return paras.map(p => p.trim()).filter(p => p.replace(/<br>/g, '').trim() !== '' || p.includes('<br>'))
    .map(p => `<p style="${ESTILO_PADRAO}">${p}</p>`).join('');
}
function limparFormatacao() {
  restaurarSelecao();
  const s = getSelection();
  let r;
  if (s.rangeCount && !s.isCollapsed && editor.contains(s.anchorNode) && editor.contains(s.focusNode)) {
    r = s.getRangeAt(0).cloneRange();
    // Lista, título, citação e alinhamento são propriedades do bloco inteiro:
    // por isso a limpeza cobre os blocos tocados pela seleção.
    const topo = n => { while (n && n.parentNode !== editor) n = n.parentNode; return n; };
    const a = topo(r.startContainer === editor ? editor.childNodes[r.startOffset] : r.startContainer);
    const b = topo(r.endContainer === editor ? editor.childNodes[r.endOffset - 1] : r.endContainer);
    if (a && b) { r.setStartBefore(a); r.setEndAfter(b); }
  } else {
    r = document.createRange(); // nada selecionado: limpa o texto todo
    r.selectNodeContents(editor);
  }
  if (!editor.firstChild) return;
  guardarSnapshot();
  const html = fragParaPlano(r.cloneContents());
  r.deleteContents();
  if (html) {
    const t = document.createElement('template');
    t.innerHTML = html;
    r.insertNode(t.content);
  }
  editor.focus();
  agendarSalvar();
  status('Formatos removidos: Arial 14, preto, à esquerda.');
}

// Ajustes feitos direto no documento (limpar, ABNT, referência, sumário) ganham um "Desfazer" próprio
let snap = null;
function guardarSnapshot() { snap = editor.innerHTML; $('btnDesfazer').hidden = false; }
function descartarSnapshot() { snap = null; $('btnDesfazer').hidden = true; }
function desfazerSnapshot() {
  if (snap === null) return;
  editor.innerHTML = snap;
  descartarSnapshot();
  garantirParagrafo(); marcarVazio();
  agendarSalvar();
  status('Alteração desfeita.');
}
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && snap !== null) { e.preventDefault(); desfazerSnapshot(); }
});

const PROPS_PARAGRAFO = ['text-align', 'text-indent', 'line-height', 'margin-bottom'];
function blocosTocados(soCursor) {
  const todos = [...editor.querySelectorAll('p,h1,h2,h3,li')];
  if (temSelecao()) { const r = getSelection().getRangeAt(0); return todos.filter(b => r.intersectsNode(b)); }
  if (!soCursor) return todos;
  const n = getSelection().anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
  const b = el && el.closest('p,h1,h2,h3,li');
  return b && editor.contains(b) ? [b] : [];
}
function aplicarEstilo(v) {
  if (!v) return;
  restaurarSelecao();
  if (v === 'h1' || v === 'h2' || v === 'blockquote') { document.execCommand('formatBlock', false, v); agendarSalvar(); return; }
  document.execCommand('formatBlock', false, 'p');
  const blocos = blocosTocados(true);
  guardarSnapshot();
  blocos.forEach(b => {
    PROPS_PARAGRAFO.forEach(k => b.style.removeProperty(k));
    if (v === 'ref') { // Referência (ABNT): à esquerda, sem recuo, espaço simples, 12 pt depois
      b.style.setProperty('text-align', 'left'); b.style.setProperty('text-indent', '0');
      b.style.setProperty('line-height', '1.15'); b.style.setProperty('margin-bottom', '12pt');
    }
    if (!b.getAttribute('style')) b.removeAttribute('style');
  });
  agendarSalvar();
  status(v === 'ref' ? 'Estilo de referência aplicado.' : 'Parágrafo ABNT aplicado.');
}

// Numeração dos títulos: a mesma conta alimenta a tela (CSS), o sumário e a exportação em Markdown
let mapaNum = null;
function numerosTitulos() {
  const m = new Map();
  let a = 0, b = 0, c = 0;
  editor.querySelectorAll('h1,h2,h3').forEach(h => {

    else if (h.tagName === 'H2') { b++; c = 0; m.set(h, `${a}.${b}`); }
    else { c++; m.set(h, `${a}.${b}.${c}`); }
  });
  return m;
}
function alternarNumeracao(forcar) {

// Sumário a partir dos títulos H1/H2, com pontos de preenchimento medidos na fonte Arial 12
function inserirSumario() {
  const hs = [...editor.querySelectorAll('h1,h2')].filter(h => h.textContent.trim());
  const nums = editor.classList.contains('num') ? numerosTitulos() : null;
  if (!hs.length) { status('Crie títulos (H1 ou H2) antes de gerar o sumário.', true); return; }
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = '12pt Arial';
  const ponto = ctx.measureText('.').width, larg = 16 * CM;
  const texto = h => {
    const ind = h.tagName === 'H2' ? CM : 0, tit = (nums ? nums.get(h) + ' ' : '') + h.textContent.trim(), pg = paginaDe(h);
    const n = Math.max(3, Math.floor((larg - ind - ctx.measureText(`${tit}  ${pg}`).width) / ponto));
    return `${tit} ${'.'.repeat(n)} ${pg}`;
  };
  const linha = h => `<p style="text-align:left;text-indent:0;line-height:1.5${h.tagName === 'H2' ? ';margin-left:1cm' : ''}">${esc(texto(h))}</p>`;
  const velho = [...editor.querySelectorAll('p')].find(p => p.textContent.trim() === 'SUMÁRIO');
  restaurarSelecao();
  guardarSnapshot();
  const t = document.createElement('template');
  t.innerHTML = '<p style="text-align:center;text-indent:0"><b>SUMÁRIO</b></p>' + hs.map(linha).join('');
  const novos = [...t.content.children];
  if (velho) { // atualiza o sumário que já existe, no mesmo lugar
    let n = velho.nextElementSibling;
    while (n && /\.{3,}\s*\d+$/.test(n.textContent)) { const x = n; n = n.nextElementSibling; x.remove(); }
    velho.replaceWith(...novos);
  } else {
    const s = getSelection();
    let topo = s.rangeCount && editor.contains(s.anchorNode) ? s.anchorNode : null;
    while (topo && topo.parentNode !== editor) topo = topo.parentNode;
    if (topo) topo.after(...novos); else editor.prepend(...novos);
  }
  // o sumário ocupa linhas e desloca os títulos: recalcula as páginas uma vez
  hs.forEach((h, i) => { novos[i + 1].textContent = texto(h); });
  agendarSalvar();
  status('Sumário gerado. Páginas aproximadas: confira antes de imprimir.');
}

// O documento sempre começa (e o Enter continua) em parágrafo <p>, que recebe o padrão ABNT
function garantirParagrafo() {
  if (!editor.firstChild || (editor.childNodes.length === 1 && editor.firstChild.nodeName === 'BR')) {
    editor.innerHTML = '<p><br></p>';
    const r = document.createRange();
    r.setStart(editor.firstChild, 0); r.collapse(true);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    return;
  }
  const s = getSelection();
  let t = s.rangeCount ? s.anchorNode : null;
  if (!t || t === editor || !editor.contains(t)) return;
  while (t.parentNode !== editor) t = t.parentNode;
  if (t.nodeType === 3 || /^(SPAN|B|I|U|S|A|STRONG|EM|BR)$/.test(t.nodeName)) document.execCommand('formatBlock', false, 'p');
}
function marcarVazio() {
  editor.classList.toggle('vazio', editor.children.length <= 1 && !editor.textContent.trim() && !editor.querySelector('img'));
}

/* ---------- Colar e arrastar ---------- */
let colarPuro = false; // Ctrl+Shift+V: cola só texto, sem nenhuma formatação
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'v') { colarPuro = true; setTimeout(() => { colarPuro = false; }, 600); }
});
editor.addEventListener('paste', e => {
  const cd = e.clipboardData;
  const html = cd.getData('text/html'), txt = cd.getData('text/plain');
  const img = [...cd.files].find(f => f.type.startsWith('image/'));
  if (img && !html && !txt) { e.preventDefault(); inserirImagem(img); return; }
  if (colarPuro && txt) { e.preventDefault(); document.execCommand('insertText', false, txt); agendarSalvar(); return; }
  if (html) { e.preventDefault(); document.execCommand('insertHTML', false, htmlSeguro(html, false, true)); agendarSalvar(); return; }
  if (/\n/.test(txt.trim())) { // texto puro com várias linhas: cada linha vira um parágrafo
    e.preventDefault();
    txt.trim().split(/\r?\n+/).forEach((l, i) => {
      if (i) document.execCommand('insertParagraph');
      document.execCommand('insertText', false, l);
    });

editor.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
editor.addEventListener('drop', e => {
  const imgs = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  e.preventDefault();
  let r = null;
  if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(e.clientX, e.clientY);
  else if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(e.clientX, e.clientY);
    if (p) { r = document.createRange(); r.setStart(p.offsetNode, p.offset); }
  }
  if (r) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  imgs.forEach(inserirImagem);
});

// Reduz imagens grandes para não estourar o limite de armazenamento do navegador
function inserirImagem(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      let src = fr.result;
      const k = Math.min(1, 1400 / im.width);
      if (file.type !== 'image/gif' && (k < 1 || file.size > 400e3)) {
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        src = c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
      }
      restaurarSelecao();
      document.execCommand('insertImage', false, src);
      agendarSalvar();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- IA (Gemini via /api/gemini) ---------- */
const PROMPTS = {
  corrigir: 'Corrija erros gramaticais, ortográficos e de pontuação do texto a seguir, sem mudar o sentido nem o tom. Responda somente com o texto corrigido.',
  melhorar: 'Melhore a clareza e a fluidez do texto a seguir, mantendo o sentido e o tom. Responda somente com o texto reescrito.',
  formal: 'Reescreva o texto a seguir em linguagem formal e institucional, em português do Brasil. Responda somente com o texto reescrito.',
  simplificar: 'Reescreva o texto a seguir em linguagem simples e direta, sem perder as informações. Responda somente com o texto reescrito.',
  resumir: 'Resuma o texto a seguir em poucas frases, em português. Responda somente com o resumo.',
  traduzir: 'Traduza o texto a seguir para inglês. Responda somente com a tradução.'
};
let alvoIA = null, ctlIA = null, cancelouIA = false;

// Aviso flutuante (substitui falhas silenciosas)
function toast(msg, tipo = 'erro', ms = 7000) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + tipo;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.className = ''; }, ms);
}
const espera = ms => new Promise(r => setTimeout(r, ms));

// Indicador de processamento: menu bloqueado, texto "A processar..." e painel com animação
function modoCarregandoIA(on) {
  const sel = $('aiSelector');
  sel.disabled = on;
  sel.options[0].textContent = on ? '⏳ A processar com o Gemini...' : '✨ IA';
  sel.style.width = on ? '210px' : '';
  sel.setAttribute('aria-busy', on);
  $('aiPanel').classList.toggle('carregando', on);
  $('btnIaFechar').textContent = on ? 'Cancelar' : 'Descartar';
  if (on) { $('aiText').textContent = 'A processar com o Gemini...'; $('aiPanel').hidden = false; }
}

function mensagemErroIA(e) {
  const st = e.status;
  if (!st) return 'Sem conexão com o servidor. Verifique a internet e tente novamente.';
  if (st === 413 || st === 400) return `O texto não foi aceito pelo servidor (limite de ${LIMITE_IA.toLocaleString('pt-BR')} caracteres). Selecione um trecho menor.`;
  if (st === 429) return 'Muitas solicitações em pouco tempo. Aguarde um instante e tente de novo.';
  if (st >= 500) return `O serviço de IA está sobrecarregado ou indisponível (erro ${st}). Tente novamente em alguns instantes.`;
  return 'Falha ao consultar a IA: ' + e.message;
}

// Faz o pedido e, em erro temporário (502/503/504/429 ou queda de rede), tenta de novo uma vez após 3 s
async function pedirIA(corpo, sinal) {
  for (let tent = 1; ; tent++) {
    try {
      const r = await fetch('/api/gemini', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo), signal: sinal });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.result) return d.result;
      const erro = new Error(d.error || 'HTTP ' + r.status);
      erro.status = r.status;
      throw erro;
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      const temporario = !e.status || [429, 502, 503, 504].includes(e.status);
      if (!temporario || tent >= 2) throw e;
      toast(`Servidor de IA ocupado${e.status ? ' (erro ' + e.status + ')' : ''}. Nova tentativa em 3 segundos...`, 'aviso', 3200);
      await espera(3000);
      if (sinal.aborted) throw new DOMException('Cancelado', 'AbortError');
    }
  }
}

async function chamarIA(acao) {
  $('aiSelector').value = '';
  if (!PROMPTS[acao] || ctlIA) return;
  restaurarSelecao();
  const temSel = temSelecao();
  const texto = temSel ? getSelection().toString() : editor.innerText;
  if (!texto.trim()) { toast('Escreva ou selecione um texto para usar a IA.', 'aviso'); return; }
  if (texto.length > LIMITE_IA) {
    toast(`O texto tem ${texto.length.toLocaleString('pt-BR')} caracteres e o limite da IA é ${LIMITE_IA.toLocaleString('pt-BR')}. Selecione um trecho menor.`);
    return;
  }
  alvoIA = temSel ? getSelection().getRangeAt(0).cloneRange() : null;
  ctlIA = new AbortController();
  cancelouIA = false;
  let tempoEsgotado = false;
  const to = setTimeout(() => { tempoEsgotado = true; ctlIA.abort(); }, 60000);
  modoCarregandoIA(true);
  status(temSel ? 'Enviando o trecho selecionado...' : 'Enviando o texto inteiro...');
  try {
    const res = await pedirIA({ prompt: PROMPTS[acao], text: texto, action: acao }, ctlIA.signal);
    modoCarregandoIA(false);
    $('aiText').textContent = res;
    status(temSel ? 'Sugestão para o trecho selecionado. Revise antes de aplicar.' : 'Sugestão para o texto inteiro. Revise antes de aplicar.');
  } catch (e) {
    modoCarregandoIA(false);
    $('aiPanel').hidden = true;
    if (cancelouIA) status('Pedido cancelado.');
    else { status('Falha ao consultar a IA.', true); toast(tempoEsgotado ? 'A IA demorou demais para responder. Tente novamente.' : mensagemErroIA(e)); }
  } finally { clearTimeout(to); ctlIA = null; }
}
function aplicarIA(modo) {
  const html = $('aiText').textContent.split(/\n{2,}/).map(p => '<p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>').join('');
  const s = getSelection();
  editor.focus();
  if (alvoIA) {
    const r = alvoIA.cloneRange();
    if (modo === 'abaixo') r.collapse(false);
    s.removeAllRanges(); s.addRange(r);
  } else {
    document.execCommand('selectAll');
    if (modo === 'abaixo') s.collapseToEnd();
  }
  document.execCommand('insertHTML', false, html);
  fecharIA();
  agendarSalvar();
}
function fecharIA() {
  if (ctlIA) { cancelouIA = true; ctlIA.abort(); } // "Cancelar" durante o processamento
  $('aiPanel').hidden = true;
  alvoIA = null;
}

/* ---------- Localizar e substituir (só no texto, sem tocar nas tags) ---------- */
let idxBusca = -1;
function regexBusca() {
  const q = $('findText').value;
  return q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), $('caseSens').checked ? 'g' : 'gi') : null;
}
function achados() {
  const re = regexBusca(), out = [];
  if (!re) return out;
  const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(n.nodeValue))) out.push([n, m.index, m.index + m[0].length]);
  }
  return out;
}
function localizar(passo) {
  const a = achados();
  const info = $('findInfo');
  if (!a.length) { info.textContent = $('findText').value ? 'Sem resultados' : ''; idxBusca = -1; return null; }
  idxBusca = (((idxBusca + passo) % a.length) + a.length) % a.length;
  const [n, s, e] = a[idxBusca];
  const r = document.createRange();
  r.setStart(n, s); r.setEnd(n, e);
  const sel = getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  n.parentElement.scrollIntoView({ block: 'center' });
  info.textContent = `${idxBusca + 1} de ${a.length}`;
  return r;
}
function substituirUnico() {
  const rep = $('replaceText').value;
  const r = idxBusca >= 0 ? localizar(0) : localizar(1);
  if (!r) return;
  editor.focus();
  const sel = getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  document.execCommand('insertText', false, rep);
  const repete = regexBusca() && regexBusca().test(rep) ? 1 : 0;
  agendarSalvar();
  idxBusca = Math.max(-1, idxBusca - 1 + repete);
  localizar(1);
}
function substituirTudo() {
  const re = regexBusca(), rep = $('replaceText').value;
  if (!re) return;
  let total = 0;
  const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nos = [];
  let n;
  while ((n = w.nextNode())) nos.push(n);
  nos.forEach(no => { no.nodeValue = no.nodeValue.replace(re, () => { total++; return rep; }); });
  $('findInfo').textContent = `${total} substituído(s)`;
  idxBusca = -1;
  agendarSalvar();
}
function toggleFindReplace(abrir) {
  const p = $('findReplacePanel');
  const mostrar = abrir === true || p.hidden;
  p.hidden = !mostrar;
  if (mostrar) {
    const s = getSelection().toString();
    if (s && s.length < 80 && !s.includes('\n')) $('findText').value = s;
    $('findText').focus(); $('findText').select();
  }
}

/* ---------- Abrir e salvar (HTML, Markdown, TXT) ---------- */
function mdParaHtml(md) {
  const inl = s => esc(s)
    .replace(/!\[[^\]]*\]\(([^)\s]+)\)/g, '<img src="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>');
  const out = []; let lista = null, par = [];
  const fechaLista = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };
  const fechaPar = () => { if (par.length) { out.push('<p>' + par.map(inl).join('<br>') + '</p>'); par = []; } };
  for (const l of md.split(/\r?\n/)) {
    let m;
    if (!l.trim()) { fechaPar(); fechaLista(); }
    else if ((m = l.match(/^(#{1,3})\s+(.*)/))) { fechaPar(); fechaLista(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); }
    else if (/^---+$/.test(l.trim())) { fechaPar(); fechaLista(); out.push('<hr>'); }
    else if ((m = l.match(/^>\s?(.*)/))) { fechaPar(); fechaLista(); out.push(`<blockquote>${inl(m[1])}</blockquote>`); }
    else if ((m = l.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      fechaPar();
      const t = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (lista !== t) { fechaLista(); out.push(`<${t}>`); lista = t; }
      out.push(`<li>${inl(m[2])}</li>`);
    } else { fechaLista(); par.push(l); }
  }
  fechaPar(); fechaLista();
  return out.join('');
}
function textoParaHtml(t) {
  return t.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
}
function paraMd(no) {
  return [...no.childNodes].map(mdNo).join('');
}
const pf = n => (mapaNum && mapaNum.get(n) ? mapaNum.get(n) + ' ' : '');
function mdNo(n) {
  if (n.nodeType === 3) return n.nodeValue.replace(/\s+/g, ' ');
  if (n.nodeType !== 1) return '';
  const t = n.tagName, c = () => paraMd(n);
  switch (t) {
    case 'B': case 'STRONG': return `**${c()}**`;
    case 'I': case 'EM': return `*${c()}*`;
    case 'S': case 'STRIKE': return `~~${c()}~~`;
    case 'H1': return `\n\n# ${pf(n)}${c()}\n\n`;
    case 'H2': return `\n\n## ${pf(n)}${c()}\n\n`;
    case 'H3': return `\n\n### ${pf(n)}${c()}\n\n`;
    case 'BR': return '  \n';
    case 'HR': return '\n\n---\n\n';
    case 'A': return `[${c()}](${n.getAttribute('href') || ''})`;
    case 'IMG': return `![](${n.getAttribute('src') || ''})`;
    case 'BLOCKQUOTE': return `\n\n> ${c().trim().replace(/\n/g, '\n> ')}\n\n`;
    case 'UL': case 'OL':
      return '\n\n' + [...n.children].map((li, i) => (t === 'UL' ? '- ' : `${i + 1}. `) + paraMd(li).trim()).join('\n') + '\n\n';
    case 'P': case 'DIV': return `\n\n${c()}\n\n`;
    default: return c();
  }
}

function abrirArquivo(ev) {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  if (editor.innerText.trim() && !confirm('Substituir o conteúdo atual pelo arquivo aberto?')) return;
  const fr = new FileReader();
  fr.onload = () => {
    const t = fr.result;
    const html = /\.html?$/i.test(f.name) ? t : /\.md$/i.test(f.name) ? mdParaHtml(t) : textoParaHtml(t);
    editor.innerHTML = htmlSeguro(html, true);
    salvar(); atualizarEstatisticas(); atualizarReguas();
  };
  fr.readAsText(f);
}

function salvarComo() {
  let nome = prompt('Nome do arquivo (.html, .md ou .txt):', 'documento.html');
  if (!nome) return;
  nome = nome.trim().replace(/[\\/:*?"<>|]/g, '_');
  const ext = (nome.match(/\.(html?|md|txt)$/i) || [])[1];
  if (!ext) nome += '.html';
  const tipo = (ext || 'html').toLowerCase();

  let conteudo, mime;
  if (tipo === 'md') {
    mapaNum = editor.classList.contains('num') ? numerosTitulos() : null;
    conteudo = paraMd(editor).replace(/\n{3,}/g, '\n\n').trim() + '\n';
    mapaNum = null;
    mime = 'text/markdown';
  } else if (tipo === 'txt') {
    conteudo = editor.innerText;
    mime = 'text/plain';
  } else {
    const cs = getComputedStyle(document.body);
    const css = `body{font-family:${getComputedStyle(editor).fontFamily};background:${cs.backgroundColor};color:${cs.color};padding:40px;max-width:800px;margin:auto;line-height:1.5;font-size:12pt}p{margin:0;text-align:justify;text-indent:1.25cm}h1,h2{text-align:left;text-indent:0}li{text-indent:0}blockquote{margin:12px 0 12px 4cm;font-size:10pt;line-height:1.15;text-align:justify}blockquote p{text-indent:0}img{max-width:100%;border-radius:8px}@page{size:A4;margin:3cm 2cm 2cm 3cm;@top-right{content:counter(page);font:12pt Arial,sans-serif;text-align:right;vertical-align:top;padding-top:2cm}}body.num{counter-reset:h1 h2 h3}body.num h1{counter-increment:h1;counter-reset:h2 h3}body.num h2{counter-increment:h2;counter-reset:h3}body.num h3{counter-increment:h3}body.num h1::before{content:counter(h1) " "}body.num h2::before{content:counter(h1) "." counter(h2) " "}body.num h3::before{content:counter(h1) "." counter(h2) "." counter(h3) " "}`;
    conteudo = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(nome.replace(/\.html?$/i, ''))}</title><style>${css}</style></head><body${editor.classList.contains('num') ? ' class="num"' : ''}>${editor.innerHTML}</body></html>`;
    mime = 'text/html';
  }
  const url = URL.createObjectURL(new Blob([conteudo], { type: mime + ';charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  status('Arquivo baixado: ' + nome);
}

/* ---------- Mascote ---------- */
function fecharBalao() { $('balao').hidden = true; }
function alternarBalao() { $('balao').hidden = !$('balao').hidden; }

/* ---------- Tecla Tab ---------- */
const TAB_HTML = '<span style="white-space:pre">\t</span>';
function removerTab() {
  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed) return;
  s.modify('extend', 'backward', 'character');
  if (s.toString() === '\t') document.execCommand('delete');
  else s.collapseToEnd();
  editor.querySelectorAll('span[style*="white-space"]:empty').forEach(n => n.remove());
}
editor.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.ctrlKey || e.altKey || e.metaKey) return;
  e.preventDefault();
  const s = getSelection();
  const no = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
  if (no && no.closest('li')) {
    document.execCommand(e.shiftKey ? 'outdent' : 'indent'); // itens de lista: sobe/desce de nível
  } else if (e.shiftKey) {
    removerTab();
  } else {
    if (!s.isCollapsed) s.collapseToStart(); // nunca apaga o texto selecionado
    document.execCommand('insertHTML', false, TAB_HTML);
  }
  agendarSalvar();
});

/* ---------- Atalhos ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('findReplacePanel').hidden = true; fecharIA(); togglePaleta(false); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); salvarComo(); }
  else if (k === 'f' || k === 'h') { e.preventDefault(); toggleFindReplace(true); }
});
</script>
