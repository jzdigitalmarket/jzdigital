<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & Robotics Technical Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #050811;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .widget-container {
      width: 100%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.1), inset 0 0 15px rgba(56, 189, 248, 0.05);
      position: relative;
    }

    /* Brilho futurista na borda superior */
    .widget-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .widget-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .status-meta {
      font-size: 0.75rem;
      color: #94a3b8;
      font-family: monospace;
    }

    /* Botão de Atualizar Futurista */
    .btn-refresh {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-refresh:hover {
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      color: #fff;
    }

    .btn-refresh.spin svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Scrollable Area */
    .news-scroll-area {
      max-height: 580px;
      overflow-y: auto;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .news-scroll-area::-webkit-scrollbar {
      width: 5px;
    }
    .news-scroll-area::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .news-scroll-area::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .news-scroll-area::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    /* Card de Notícia */
    .news-item {
      display: flex;
      gap: 1rem;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .news-item:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Miniatura (Thumbnail) */
    .news-thumb-wrapper {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      background-color: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .news-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .news-thumb-placeholder {
      font-size: 1.5rem;
      color: #38bdf8;
      opacity: 0.5;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .news-item-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }

    .news-source-tag {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .news-date {
      font-size: 0.7rem;
      color: #64748b;
      font-family: monospace;
    }

    .news-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.35;
      margin-bottom: 0.3rem;
    }

    .news-item:hover .news-item-title {
      color: #38bdf8;
    }

    .news-item-snippet {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <div class="header-left">
        <h2 class="widget-title">AI & Robotics Radar</h2>
        <span id="status" class="status-meta">Initializing feed scanners...</span>
      </div>
      <button id="refresh-btn" class="btn-refresh" onclick="loadAllNews()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6"></path>
          <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M2.5 16l1 1a10 10 0 0 0 18.8-4.3"></path>
        </svg>
        Sync
      </button>
    </div>

    <div class="news-scroll-area" id="news-container"></div>
  </div>

  <script>
    // Lista Expandida de Fontes RSS de alta relevância técnica
    const RSS_FEEDS = [
      { name: 'ArXiv (AI & RO)', url: 'https://rss.arxiv.org/rss/cs.AI+cs.RO' },
      { name: 'IEEE Spectrum RO', url: 'https://spectrum.ieee.org/feeds/topic/robotics.rss' },
      { name: 'IEEE Spectrum AI', url: 'https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss' },
      { name: 'NVIDIA Tech Blog', url: 'https://developer.nvidia.com/blog/feed/' },
      { name: 'Google DeepMind', url: 'https://deepmind.google/blog/rss.xml' },
      { name: 'OpenAI Blog', url: 'https://openai.com/news/rss.xml' },
      { name: 'MIT Tech Review', url: 'https://www.technologyreview.com/feed/' },
      { name: 'TechCrunch AI', url: 'https://techcrunch.com/category/artificial-intelligence/feed/' },
      { name: 'The Robot Report', url: 'https://www.therobotreport.com/feed/' },
      { name: 'BAIR Blog', url: 'https://bair.berkeley.edu/blog/feed.xml' }
    ];

    const BANNED_TERMS = [
      'government', 'politics', 'election', 'congress', 'senate', 'legislation', 
      'lawsuit', 'copyright', 'union', 'bias', 'diversity', 'inclusion', 
      'ethics committee', 'biden', 'trump', 'white house', 'eu act'
    ];

    const RSS2JSON_ENDPOINT = 'https://api.rss2json.com/v1/api.json?rss_url=';

    // Extrai imagem válida da estrutura do RSS
    function extractThumbnail(item) {
      if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
      if (item.enclosure && item.enclosure.link && item.enclosure.link.startsWith('http')) return item.enclosure.link;
      
      // Busca tag <img> dentro da descrição caso exista
      if (item.description) {
        const imgMatch = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (imgMatch && imgMatch[1]) return imgMatch[1];
      }
      return null;
    }

    async function fetchSingleFeed(feed) {
      try {
        const response = await fetch(`${RSS2JSON_ENDPOINT}${encodeURIComponent(feed.url)}`);
        const data = await response.json();

        if (data.status === 'ok') {
          return data.items.map(item => ({
            source: feed.name,
            title: item.title,
            link: item.link,
            pubDate: new Date(item.pubDate),
            snippet: item.description ? item.description.replace(/<[^>]*>?/gm, '').replace(/^Abstract:\s*/i, '').trim() : '',
            thumbnail: extractThumbnail(item)
          }));
        }
        return [];
      } catch (error) {
        return [];
      }
    }

    function isTechnicalContent(article) {
      const fullText = `${article.title} ${article.snippet}`.toLowerCase();
      return !BANNED_TERMS.some(term => fullText.includes(term));
    }

    async function loadAllNews() {
      const statusElement = document.getElementById('status');
      const containerElement = document.getElementById('news-container');
      const refreshBtn = document.getElementById('refresh-btn');

      refreshBtn.classList.add('spin');
      statusElement.textContent = 'Syncing feeds...';

      const results = await Promise.all(RSS_FEEDS.map(fetchSingleFeed));
      let allArticles = results.flat();

      const filteredArticles = allArticles.filter(isTechnicalContent);

      refreshBtn.classList.remove('spin');

      if (filteredArticles.length === 0) {
        statusElement.textContent = 'No technical updates available.';
        return;
      }

      filteredArticles.sort((a, b) => b.pubDate - a.pubDate);

      const MAX_ITEMS = 35;
      const topArticles = filteredArticles.slice(0, MAX_ITEMS);

      statusElement.textContent = `${topArticles.length} signals intercepted`;

      containerElement.innerHTML = topArticles.map(article => `
        <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="news-item">
          <div class="news-thumb-wrapper">
            ${article.thumbnail 
              ? `<img src="${article.thumbnail}" class="news-thumb" alt="Thumbnail" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                 <div class="news-thumb-placeholder" style="display:none;">⚡</div>`
              : `<div class="news-thumb-placeholder">⚡</div>`
            }
          </div>
          <div class="news-content">
            <div>
              <div class="news-item-header">
                <span class="news-source-tag">${article.source}</span>
                <span class="news-date">${article.pubDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
              </div>
              <div class="news-item-title">${article.title}</div>
            </div>
            ${article.snippet ? `<div class="news-item-snippet">${article.snippet}</div>` : ''}
          </div>
        </a>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadAllNews);
  </script>
</body>
</html>
