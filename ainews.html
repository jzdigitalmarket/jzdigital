<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed de Notícias de IA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }

    .widget-container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .widget-title {
      font-size: 1.25rem;
      color: #38bdf8;
      font-weight: 700;
    }

    .status-meta {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Container de Rolagem Interna */
    .news-scroll-area {
      max-height: 520px; /* Limita a altura para não esticar a página */
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    /* Estilização da barra de rolagem */
    .news-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .news-scroll-area::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 4px;
    }
    .news-scroll-area::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .news-scroll-area::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    /* Layout Compacto de Lista */
    .news-item {
      display: block;
      padding: 0.75rem 0;
      border-bottom: 1px solid #2d3748;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-item:hover .news-item-title {
      color: #38bdf8;
    }

    .news-item-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .news-source-tag {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.12);
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .news-date {
      font-size: 0.7rem;
      color: #64748b;
    }

    .news-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.35;
      margin-bottom: 0.2rem;
    }

    .news-item-snippet {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2; /* Limita a descrição em até 2 linhas */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <h2 class="widget-title">Radar de Inteligência Artificial</h2>
      <span id="status" class="status-meta">Carregando notícias...</span>
    </div>

    <!-- Área com Scroll para suportar mais itens sem quebrar a página -->
    <div class="news-scroll-area" id="news-container"></div>
  </div>

  <script>
    const RSS_FEEDS = [
      { name: 'MIT Tech Review BR', url: 'https://mittechreview.com.br/topicos/inteligencia-artificial/feed/' },
      { name: 'Inovação Tecnológica', url: 'https://www.inovacaotecnologica.com.br/boletim/rss_inteligencia-artificial.xml' },
      { name: 'Canaltech', url: 'https://canaltech.com.br/rss/inteligencia-artificial/' },
      { name: 'Google News BR', url: 'https://news.google.com/rss/search?q=Inteligencia+Artificial&hl=pt-BR&gl=BR&ceid=BR:pt-419' }
    ];

    const RSS2JSON_ENDPOINT = 'https://api.rss2json.com/v1/api.json?rss_url=';

    async function fetchSingleFeed(feed) {
      try {
        const response = await fetch(`${RSS2JSON_ENDPOINT}${encodeURIComponent(feed.url)}`);
        const data = await response.json();

        if (data.status === 'ok') {
          return data.items.map(item => ({
            source: feed.name,
            title: item.title,
            link: item.link,
            pubDate: new Date(item.pubDate),
            snippet: item.description ? item.description.replace(/<[^>]*>?/gm, '') : ''
          }));
        }
        return [];
      } catch (error) {
        return [];
      }
    }

    async function loadAllNews() {
      const statusElement = document.getElementById('status');
      const containerElement = document.getElementById('news-container');

      const results = await Promise.all(RSS_FEEDS.map(fetchSingleFeed));
      let allArticles = results.flat();

      if (allArticles.length === 0) {
        statusElement.textContent = 'Indisponível no momento.';
        return;
      }

      // Ordena pelas notícias mais recentes
      allArticles.sort((a, b) => b.pubDate - a.pubDate);

      // >>> AJUSTE AQUI: Aumentado para 30 itens exibidos simultaneamente <<<
      const MAX_ITEMS = 30;
      const topArticles = allArticles.slice(0, MAX_ITEMS);

      statusElement.textContent = `${topArticles.length} notícias atualizadas`;

      containerElement.innerHTML = topArticles.map(article => `
        <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="news-item">
          <div class="news-item-header">
            <span class="news-source-tag">${article.source}</span>
            <span class="news-date">${article.pubDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
          </div>
          <div class="news-item-title">${article.title}</div>
          ${article.snippet ? `<div class="news-item-snippet">${article.snippet}</div>` : ''}
        </a>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadAllNews);
  </script>
</body>
</html>
