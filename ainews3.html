<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Portuário — JZ Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #050811;
      
      /* Background com fallback seguro */
      background:
        radial-gradient(circle at 15% 0%, rgba(14, 165, 233, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(20, 184, 166, 0.12) 0%, transparent 42%),
        linear-gradient(145deg, #03101c, #071827 55%, #04111d);

      color: #f8fafc;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .widget-container {
      width: 100%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.1), inset 0 0 15px rgba(56, 189, 248, 0.05);
      position: relative;
    }

    .widget-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .widget-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .status-meta {
      font-size: 0.75rem;
      color: #94a3b8;
      font-family: monospace;
    }

    /* Estilização das Abas */
    .tabs-navigation {
      display: flex;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.3rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.45rem 0.9rem;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }

    .btn-refresh {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-refresh:hover {
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      color: #fff;
    }

    .btn-refresh.spin svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Conteúdo das Abas */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .news-scroll-area {
      max-height: 580px;
      overflow-y: auto;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .news-scroll-area::-webkit-scrollbar {
      width: 5px;
    }
    .news-scroll-area::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .news-scroll-area::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .news-scroll-area::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    /* Card de Notícia Único */
    .news-item {
      display: flex;
      gap: 1rem;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .news-item:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .news-thumb-wrapper {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      background-color: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .news-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .news-thumb-placeholder {
      font-size: 1.5rem;
      color: #38bdf8;
      opacity: 0.5;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .news-item-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }

    .news-source-tag {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    /* Tag especial para Reddit/Bluesky */
    .news-source-tag.global {
      color: #a855f7;
      background-color: rgba(168, 85, 247, 0.12);
      border-color: rgba(168, 85, 247, 0.25);
    }

    .news-date {
      font-size: 0.7rem;
      color: #64748b;
      font-family: monospace;
    }

    .news-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.35;
      margin-bottom: 0.3rem;
    }

    .news-item:hover .news-item-title {
      color: #38bdf8;
    }

    .news-item-snippet {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <div class="header-left">
        <h2 class="widget-title">Radar Portuário</h2>
        <span id="status" class="status-meta">Preparando fontes portuárias...</span>
      </div>

      <div class="tabs-navigation">
        <button class="tab-btn active" onclick="switchTab('brasil-tab', this)">
          <span>⚓</span> Brasil e Regulação
        </button>
        <button class="tab-btn" onclick="switchTab('global-tab', this)">
          <span>🌐</span> Portos e Tecnologia
        </button>
      </div>

      <button id="refresh-btn" class="btn-refresh" onclick="loadAllNews()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6"></path>
          <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M2.5 16l1 1a10 10 0 0 0 18.8-4.3"></path>
        </svg>
        Atualizar
      </button>
    </div>

    <div id="brasil-tab" class="tab-content active">
      <div class="news-scroll-area" id="brasil-container"></div>
    </div>

    <div id="global-tab" class="tab-content">
      <div class="news-scroll-area" id="global-container"></div>
    </div>
  </div>

  <script>
    const BRASIL_FEEDS = [
      { name: 'Itajaí e Navegantes', url: 'https://news.google.com/rss/search?q=%22porto+de+Itaja%C3%AD%22+OR+Portonave+OR+%22porto+de+Navegantes%22&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'ANTAQ e Regulação', url: 'https://news.google.com/rss/search?q=ANTAQ+portos+OR+%22regula%C3%A7%C3%A3o+portu%C3%A1ria%22&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'Portos do Brasil', url: 'https://news.google.com/rss/search?q=%22portos+brasileiros%22+OR+%22setor+portu%C3%A1rio%22&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'Aduana e Receita', url: 'https://news.google.com/rss/search?q=%22Receita+Federal%22+portos+OR+aduana+portu%C3%A1ria&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'Ministério de Portos', url: 'https://news.google.com/rss/search?q=%22Minist%C3%A9rio+de+Portos+e+Aeroportos%22+portos&hl=pt-BR&gl=BR&ceid=BR:pt-419' }
    ];

    const GLOBAL_FEEDS = [
      { name: 'Portos e Terminais', url: 'https://news.google.com/rss/search?q=ports+terminals+shipping&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'Tecnologia Portuária', url: 'https://news.google.com/rss/search?q=%22port+technology%22+OR+%22port+automation%22&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'Logística Marítima', url: 'https://news.google.com/rss/search?q=%22maritime+logistics%22+OR+shipping+ports&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
      { name: 'gCaptain', url: 'https://gcaptain.com/feed/' }
    ];

    const PORT_TERMS = [
      'porto', 'portuár', 'terminal', 'antaq', 'aduana', 'alfândega',
      'navio', 'marítim', 'cabotagem', 'dragagem', 'contêiner', 'container',
      'logística', 'shipping', 'vessel', 'berth', 'harbor', 'freight'
    ];

    const RSS2JSON_ENDPOINT = 'https://api.rss2json.com/v1/api.json?rss_url=';
    let currentTab = 'brasil-tab';

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
      currentTab = tabId;
    }

    function escapeHTML(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
      } catch {
        return '#';
      }
    }

    function extractThumbnail(item) {
      if (item.thumbnail && item.thumbnail.startsWith('http')) return safeUrl(item.thumbnail);
      if (item.enclosure?.link?.startsWith('http')) return safeUrl(item.enclosure.link);
      const match = item.description?.match(/<img[^>]+src=["']([^"']+)["']/i);
      return match?.[1] ? safeUrl(match[1]) : null;
    }

    async function fetchSingleFeed(feed, isGlobal = false) {
      try {
        const response = await fetch(`${RSS2JSON_ENDPOINT}${encodeURIComponent(feed.url)}`, { cache: 'no-store' });
        if (!response.ok) return [];
        const data = await response.json();
        if (data.status !== 'ok' || !Array.isArray(data.items)) return [];

        return data.items.map(item => ({
          source: feed.name,
          title: item.title || 'Notícia portuária',
          link: safeUrl(item.link),
          pubDate: new Date(item.pubDate),
          snippet: item.description
            ? item.description.replace(/<[^>]*>?/gm, '').replace(/\s+/g, ' ').trim()
            : '',
          thumbnail: extractThumbnail(item),
          isGlobal
        }));
      } catch {
        return [];
      }
    }

    function isPortContent(article) {
      const text = `${article.title} ${article.snippet}`.toLocaleLowerCase('pt-BR');
      return PORT_TERMS.some(term => text.includes(term));
    }

    function uniqueArticles(articles) {
      const seen = new Set();
      return articles.filter(article => {
        const key = article.title.toLocaleLowerCase('pt-BR').replace(/\s+/g, ' ').trim();
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderArticles(articles, containerId) {
      const container = document.getElementById(containerId);
      if (!articles.length) {
        container.innerHTML = '<div style="color:#64748b;padding:1rem;text-align:center;">Nenhuma atualização portuária encontrada no momento.</div>';
        return;
      }

      container.innerHTML = articles.map(article => {
        const title = escapeHTML(article.title);
        const source = escapeHTML(article.source);
        const snippet = escapeHTML(article.snippet);
        const link = safeUrl(article.link);
        const thumbnail = article.thumbnail ? safeUrl(article.thumbnail) : null;
        const date = Number.isNaN(article.pubDate.getTime())
          ? 'Data não informada'
          : article.pubDate.toLocaleDateString('pt-BR', {
              day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
            });

        return `
          <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-item">
            <div class="news-thumb-wrapper">
              ${thumbnail
                ? `<img src="${thumbnail}" class="news-thumb" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                   <div class="news-thumb-placeholder" style="display:none;">${article.isGlobal ? '🌐' : '⚓'}</div>`
                : `<div class="news-thumb-placeholder">${article.isGlobal ? '🌐' : '⚓'}</div>`
              }
            </div>
            <div class="news-content">
              <div>
                <div class="news-item-header">
                  <span class="news-source-tag ${article.isGlobal ? 'global' : ''}">${source}</span>
                  <span class="news-date">${date}</span>
                </div>
                <div class="news-item-title">${title}</div>
              </div>
              ${snippet ? `<div class="news-item-snippet">${snippet}</div>` : ''}
            </div>
          </a>
        `;
      }).join('');
    }

    async function loadAllNews() {
      const status = document.getElementById('status');
      const button = document.getElementById('refresh-btn');
      button.classList.add('spin');
      button.disabled = true;
      status.textContent = 'Consultando notícias, normas e operações portuárias...';

      try {
        const [brasilResults, globalResults] = await Promise.all([
          Promise.all(BRASIL_FEEDS.map(feed => fetchSingleFeed(feed, false))),
          Promise.all(GLOBAL_FEEDS.map(feed => fetchSingleFeed(feed, true)))
        ]);

        const brasil = uniqueArticles(brasilResults.flat().filter(isPortContent))
          .sort((a, b) => b.pubDate - a.pubDate)
          .slice(0, 40);
        const global = uniqueArticles(globalResults.flat().filter(isPortContent))
          .sort((a, b) => b.pubDate - a.pubDate)
          .slice(0, 40);

        renderArticles(brasil, 'brasil-container');
        renderArticles(global, 'global-container');
        status.textContent = `${brasil.length + global.length} atualizações portuárias encontradas`;
      } catch {
        status.textContent = 'Não foi possível atualizar todas as fontes agora.';
        renderArticles([], 'brasil-container');
        renderArticles([], 'global-container');
      } finally {
        button.classList.remove('spin');
        button.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAllNews);
  </script>
</body>
</html>
